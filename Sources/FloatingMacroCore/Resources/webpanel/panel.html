<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>FloatingMacro — {{PRESET_DISPLAY}}</title>
<!--
  Critical CSS は <style> で inline (=外部 fetch 不要、render block ゼロ)。
  サムネ詳細スタイルは外部 CSS に残し、<link> は async load する (paint 後に届けば OK)。
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#1c1c1e;color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
header{display:flex;justify-content:space-between;align-items:center;
  padding:max(env(safe-area-inset-top,12px),12px) 16px 12px;background:#2c2c2e;
  border-bottom:1px solid #3a3a3c;position:sticky;top:0;z-index:10}
header .title{font-weight:600;font-size:17px}
header .status{font-size:13px;color:#8e8e93}
header .status.ok{color:#30d158}
header .status.error{color:#ff453a}
main{padding:16px;padding-bottom:max(env(safe-area-inset-bottom,16px),16px)}
.group{margin-bottom:24px}
.group h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  color:#8e8e93;margin:0 0 10px}
.group.icon .buttons{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.group.wide .buttons{display:grid;grid-template-columns:1fr;gap:8px}
.group.card .buttons{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#2c2c2e;border:1px solid #3a3a3c;border-radius:12px;color:#f5f5f7;
  cursor:pointer;user-select:none;-webkit-user-select:none;font:inherit;text-align:center;
  padding:10px 8px;transition:transform .06s ease,background .15s ease,border-color .15s ease;
  touch-action:manipulation;min-height:76px;contain:content}
.btn:active{transform:scale(.96);background:#3a3a3c}
.btn .icon{font-size:28px;line-height:1;margin-bottom:4px;display:flex;
  align-items:center;justify-content:center;min-height:28px;min-width:28px}
.btn .icon .icon-img{width:32px;height:32px;object-fit:contain;display:block}
.group.wide .btn .icon .icon-img{width:24px;height:24px}
.btn .label{font-size:12px;line-height:1.25;word-break:break-word;display:-webkit-box;
  -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.btn.text-only{min-height:48px;padding:12px 10px}
.btn.text-only .label{font-size:14px;-webkit-line-clamp:3}
.group.wide .btn{flex-direction:row;justify-content:flex-start;gap:12px;
  padding:12px 14px;min-height:56px}
.group.wide .btn .icon{font-size:22px;margin:0}
.group.wide .btn .label{font-size:14px;text-align:left;-webkit-line-clamp:2}
.group.card .btn{padding:0;overflow:hidden;min-height:140px}
.group.card .btn .thumb{width:100%;aspect-ratio:16/10;background:#1c1c1e linear-gradient(
  90deg,#2c2c2e 25%,#3a3a3c 50%,#2c2c2e 75%) 0 0/200% 100%;animation:fm-shimmer 1.2s infinite}
.group.card .btn .thumb.loaded{animation:none;background-size:cover;background-position:center}
.group.card .btn.thumb-fit .thumb.loaded{background-size:contain;background-repeat:no-repeat}
/* card 型でアプリアイコン (写真サムネではなく square icon) のとき: 写真と
   同じ 16:10 ボックス内に **iOS ホーム画面の 60pt アイコン相当**を中央配置。
   stretch ではなく contain で破綻しない。 */
.group.card .btn.app-icon-card .thumb{display:flex;align-items:center;
  justify-content:center;background:#1c1c1e;animation:none}
.group.card .btn.app-icon-card .thumb img.app-icon-img{
  width:60px;height:60px;object-fit:contain;display:block;
  border-radius:13.5px /* iOS continuous corner radius (60×0.225) */}
.group.card .btn .icon{display:none}
.group.card .btn .body{padding:8px 10px 12px;width:100%;text-align:left}
.group.card .btn .label{font-size:13px;text-align:left;-webkit-line-clamp:2}
.btn.firing{background:#3a3a3c;border-color:#ffd60a}
.btn.success{background:#1f3a28;border-color:#30d158}
.btn.failure{background:#3a1c1c;border-color:#ff453a}
.empty{text-align:center;color:#8e8e93;font-size:14px;padding:32px 16px}
.hidden{display:none!important}
/* Skeleton: 初期 HTML 内に並ぶ仮ボタン。JS が DOM を差し替えると消える。 */
.skeleton{background:linear-gradient(90deg,#2c2c2e 25%,#3a3a3c 50%,#2c2c2e 75%);
  background-size:200% 100%;animation:fm-shimmer 1.2s infinite;border-color:#3a3a3c}
.skeleton .label{visibility:hidden}
@keyframes fm-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <div class="title">FloatingMacro <span style="color:#8e8e93;font-weight:400">— {{PRESET_DISPLAY}}</span></div>
  <div class="status" id="status">接続中…</div>
</header>
<main>
  <!--
    SSR された preset 構造を初期 HTML として描画する。JS が読み込まれる前から
    レイアウト + skeleton が表示されるので、最初の paint が即座に見える。
    JS は読み込み後に skeleton を本物のボタンに差し替える (画像が届いたら shimmer 解除)。
  -->
  <section id="panels">{{SSR_HTML}}</section>
  <div id="empty" class="empty hidden">パネルがありません</div>
</main>
<script>
  // サーバーが置換: トークンと preset データを inline で渡す。これで JS 起動と
  // 同時に画像 fetch を始められる (= 別 round trip の preset_get が不要)。
  window.__FM_TOKEN__   = "{{TOKEN}}";
  window.__FM_PRESET__  = {{PRESET_JSON}};
</script>
<script src="/webpanel/app.js" defer></script>
</body>
</html>
